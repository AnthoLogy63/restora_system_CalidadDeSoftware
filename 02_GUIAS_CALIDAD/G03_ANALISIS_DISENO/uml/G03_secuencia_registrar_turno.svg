<svg xmlns="http://www.w3.org/2000/svg" width="1330" height="780" viewBox="0 0 1330 780" font-family="Inter, 'Segoe UI', Arial, sans-serif"><title>Diagrama de secuencia: registrar turno</title><defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1c1917"/></marker>
<marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#1c1917" stroke-width="1.5"/></marker>
<marker id="tri" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1,1 L12,7 L1,13 Z" fill="#fff" stroke="#1c1917" stroke-width="1.4"/></marker>
<marker id="dia" markerWidth="16" markerHeight="12" refX="1" refY="6" orient="auto-start-reverse"><path d="M1,6 L8,1 L15,6 L8,11 Z" fill="#1c1917"/></marker>
<marker id="wine" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7a1f3d"/></marker>
</defs><rect width="100%" height="100%" fill="#fff"/><text x="30" y="34" font-size="17" font-weight="700" text-anchor="start" fill="#7a1f3d">Secuencia — CU-01 Registrar turno (producción, ventas y desperdicios)</text><rect x="25.0" y="60" width="110" height="36" rx="6" fill="#fff" stroke="#7a1f3d" stroke-width="1.6"/><text x="80" y="83" font-size="12.5" font-weight="700" text-anchor="middle" fill="#7a1f3d">Usuario</text><line x1="80" y1="96" x2="80" y2="740" stroke="#a8a29e" stroke-width="1.2" stroke-dasharray="5,5"/><rect x="174.4" y="60" width="111.19999999999999" height="36" rx="6" fill="#fdf2f5" stroke="#7a1f3d" stroke-width="1.6"/><text x="230" y="83" font-size="12.5" font-weight="700" text-anchor="middle" fill="#7a1f3d">register.tsx</text><line x1="230" y1="96" x2="230" y2="740" stroke="#a8a29e" stroke-width="1.2" stroke-dasharray="5,5"/><rect x="335.0" y="60" width="110" height="36" rx="6" fill="#fdf2f5" stroke="#7a1f3d" stroke-width="1.6"/><text x="390" y="83" font-size="12.5" font-weight="700" text-anchor="middle" fill="#7a1f3d">lib/api.ts</text><line x1="390" y1="96" x2="390" y2="740" stroke="#a8a29e" stroke-width="1.2" stroke-dasharray="5,5"/><rect x="485.4" y="60" width="149.2" height="36" rx="6" fill="#fdf2f5" stroke="#7a1f3d" stroke-width="1.6"/><text x="560" y="83" font-size="12.5" font-weight="700" text-anchor="middle" fill="#7a1f3d">POST /operaciones</text><line x1="560" y1="96" x2="560" y2="740" stroke="#a8a29e" stroke-width="1.2" stroke-dasharray="5,5"/><rect x="685.0" y="60" width="110" height="36" rx="6" fill="#fdf2f5" stroke="#7a1f3d" stroke-width="1.6"/><text x="740" y="83" font-size="12.5" font-weight="700" text-anchor="middle" fill="#7a1f3d">lib/auth.ts</text><line x1="740" y1="96" x2="740" y2="740" stroke="#a8a29e" stroke-width="1.2" stroke-dasharray="5,5"/><rect x="814.0" y="60" width="172.0" height="36" rx="6" fill="#fdf2f5" stroke="#7a1f3d" stroke-width="1.6"/><text x="900" y="83" font-size="12.5" font-weight="700" text-anchor="middle" fill="#7a1f3d">lib/validation (Zod)</text><line x1="900" y1="96" x2="900" y2="740" stroke="#a8a29e" stroke-width="1.2" stroke-dasharray="5,5"/><rect x="1004.4" y="60" width="111.19999999999999" height="36" rx="6" fill="#fdf2f5" stroke="#7a1f3d" stroke-width="1.6"/><text x="1060" y="83" font-size="12.5" font-weight="700" text-anchor="middle" fill="#7a1f3d">lib/costo.ts</text><line x1="1060" y1="96" x2="1060" y2="740" stroke="#a8a29e" stroke-width="1.2" stroke-dasharray="5,5"/><rect x="1153.0" y="60" width="134.0" height="36" rx="6" fill="#fdf2f5" stroke="#7a1f3d" stroke-width="1.6"/><text x="1220" y="83" font-size="12.5" font-weight="700" text-anchor="middle" fill="#7a1f3d">Prisma / SQLite</text><line x1="1220" y1="96" x2="1220" y2="740" stroke="#a8a29e" stroke-width="1.2" stroke-dasharray="5,5"/><line x1="80" y1="140" x2="227" y2="140" stroke="#1c1917" stroke-width="1.3" marker-end="url(#arrow)"/><text x="155.0" y="134" font-size="11.8" font-weight="500" text-anchor="middle" fill="#1c1917">1: completa fecha, turno, ventas y desperdicios</text><line x1="80" y1="176" x2="227" y2="176" stroke="#1c1917" stroke-width="1.3" marker-end="url(#arrow)"/><text x="155.0" y="170" font-size="11.8" font-weight="500" text-anchor="middle" fill="#1c1917">2: pulsa «Guardar registro»</text><line x1="230" y1="212" x2="387" y2="212" stroke="#1c1917" stroke-width="1.3" marker-end="url(#arrow)"/><text x="310.0" y="206" font-size="11.8" font-weight="500" text-anchor="middle" fill="#1c1917">3: createOperacion(restauranteId, datos)</text><line x1="390" y1="248" x2="557" y2="248" stroke="#1c1917" stroke-width="1.3" marker-end="url(#arrow)"/><text x="475.0" y="242" font-size="11.8" font-weight="500" text-anchor="middle" fill="#1c1917">4: POST /api/restaurantes/{id}/operaciones (cookie de sesión)</text><line x1="560" y1="284" x2="737" y2="284" stroke="#1c1917" stroke-width="1.3" marker-end="url(#arrow)"/><text x="650.0" y="278" font-size="11.8" font-weight="500" text-anchor="middle" fill="#1c1917">5: requireSession(request, id)</text><line x1="740" y1="320" x2="563" y2="320" stroke="#1c1917" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#open)"/><text x="650.0" y="314" font-size="11.8" font-weight="500" text-anchor="middle" fill="#1c1917">6: sesión válida (o 401/403)</text><line x1="560" y1="356" x2="897" y2="356" stroke="#1c1917" stroke-width="1.3" marker-end="url(#arrow)"/><text x="730.0" y="350" font-size="11.8" font-weight="500" text-anchor="middle" fill="#1c1917">7: createRegistroOperacionSchema.parse(body)</text><line x1="900" y1="392" x2="563" y2="392" stroke="#1c1917" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#open)"/><text x="730.0" y="386" font-size="11.8" font-weight="500" text-anchor="middle" fill="#1c1917">8: datos válidos (o 400 con el campo inválido)</text><line x1="560" y1="428" x2="1057" y2="428" stroke="#1c1917" stroke-width="1.3" marker-end="url(#arrow)"/><text x="810.0" y="422" font-size="11.8" font-weight="500" text-anchor="middle" fill="#1c1917">9: calcularCostoTotal(producto activo, kg, costoManual)</text><line x1="1060" y1="464" x2="1217" y2="464" stroke="#1c1917" stroke-width="1.3" marker-end="url(#arrow)"/><text x="1140.0" y="458" font-size="11.8" font-weight="500" text-anchor="middle" fill="#1c1917">10: producto.findFirst({activo: true})</text><line x1="1220" y1="500" x2="1063" y2="500" stroke="#1c1917" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#open)"/><text x="1140.0" y="494" font-size="11.8" font-weight="500" text-anchor="middle" fill="#1c1917">11: costoUnitario  (o null)</text><line x1="1060" y1="536" x2="563" y2="536" stroke="#1c1917" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#open)"/><text x="810.0" y="530" font-size="11.8" font-weight="500" text-anchor="middle" fill="#1c1917">12: costoTotal = costoUnitario × kg</text><line x1="560" y1="572" x2="1217" y2="572" stroke="#1c1917" stroke-width="1.3" marker-end="url(#arrow)"/><text x="890.0" y="566" font-size="11.8" font-weight="500" text-anchor="middle" fill="#1c1917">13: registroOperacion.create(ventas, producciones, residuos)</text><line x1="1220" y1="608" x2="563" y2="608" stroke="#1c1917" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#open)"/><text x="890.0" y="602" font-size="11.8" font-weight="500" text-anchor="middle" fill="#1c1917">14: registro creado</text><line x1="560" y1="644" x2="393" y2="644" stroke="#1c1917" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#open)"/><text x="475.0" y="638" font-size="11.8" font-weight="500" text-anchor="middle" fill="#1c1917">15: 201 Created (JSON)</text><line x1="230" y1="680" x2="83" y2="680" stroke="#1c1917" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#open)"/><text x="155.0" y="674" font-size="11.8" font-weight="500" text-anchor="middle" fill="#1c1917">16: redirige al Historial</text><rect x="520" y="112" width="740" height="24" rx="0" fill="none" stroke="none" stroke-width="1.5"/><text x="30" y="765" font-size="12" font-weight="400" text-anchor="start" fill="#6b5f5f">Si 5 u 7 fallan, el flujo termina con el código HTTP indicado y no se guarda ningún registro parcial (RNF integridad).</text></svg>