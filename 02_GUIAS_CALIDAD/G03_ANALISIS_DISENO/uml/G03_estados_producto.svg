<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" font-family="Inter, 'Segoe UI', Arial, sans-serif"><title>Estados de Producto (CC-01)</title><defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1c1917"/></marker>
<marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#1c1917" stroke-width="1.5"/></marker>
<marker id="tri" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1,1 L12,7 L1,13 Z" fill="#fff" stroke="#1c1917" stroke-width="1.4"/></marker>
<marker id="dia" markerWidth="16" markerHeight="12" refX="1" refY="6" orient="auto-start-reverse"><path d="M1,6 L8,1 L15,6 L8,11 Z" fill="#1c1917"/></marker>
<marker id="wine" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7a1f3d"/></marker>
</defs><rect width="100%" height="100%" fill="#fff"/><text x="30" y="34" font-size="17" font-weight="700" text-anchor="start" fill="#7a1f3d">Estados de un Producto del catálogo — con el cambio CC-01</text><circle cx="40" cy="150" r="8" fill="#1c1917"/><rect x="130" y="120" width="150" height="60" rx="14" fill="#fdf2f5" stroke="#7a1f3d" stroke-width="2"/><text x="205" y="156" font-size="16" font-weight="700" text-anchor="middle" fill="#7a1f3d">Activo</text><rect x="560" y="120" width="150" height="60" rx="14" fill="#fff7e6" stroke="#b7791f" stroke-width="2"/><text x="635" y="156" font-size="16" font-weight="700" text-anchor="middle" fill="#b7791f">Inactivo</text><circle cx="900" cy="150" r="12" fill="#fff" stroke="#1c1917" stroke-width="2"/><circle cx="900" cy="150" r="6" fill="#1c1917"/><line x1="48" y1="150" x2="128" y2="150" stroke="#1c1917" stroke-width="1.4" marker-end="url(#arrow)"/><text x="88" y="140" font-size="12" font-weight="600" text-anchor="middle" fill="#1c1917">crear</text><line x1="280" y1="135" x2="558" y2="135" stroke="#1c1917" stroke-width="1.4" marker-end="url(#arrow)"/><text x="420" y="124" font-size="12.5" font-weight="600" text-anchor="middle" fill="#b7791f">baja [con historial]</text><line x1="558" y1="168" x2="282" y2="168" stroke="#1c1917" stroke-width="1.4" marker-end="url(#arrow)"/><text x="420" y="190" font-size="12.5" font-weight="600" text-anchor="middle" fill="#2f7d4f">reactivar</text><polyline points="205,120 205,60 900,60 900,136" fill="none" stroke="#1c1917" stroke-width="1.4" marker-end="url(#arrow)"/><text x="550" y="52" font-size="12.5" font-weight="600" text-anchor="middle" fill="#c62828">baja [sin historial]  →  se elimina el registro</text><text x="30" y="250" font-size="12" font-weight="400" text-anchor="start" fill="#6b5f5f">Reglas: un producto inactivo no se usa para calcular el costo de nuevos registros (costo.ts) ni se ofrece al asistente (contexto.ts);</text><text x="30" y="270" font-size="12" font-weight="400" text-anchor="start" fill="#6b5f5f">los registros históricos conservan su costoTotal. Regla implementada en src/lib/catalogo.ts (decidirBajaProducto).</text></svg>