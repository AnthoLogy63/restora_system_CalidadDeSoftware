<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="Inter, 'Segoe UI', Arial, sans-serif"><title>Arquitectura de RESTORA</title><defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1c1917"/></marker>
<marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#1c1917" stroke-width="1.5"/></marker>
<marker id="tri" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1,1 L12,7 L1,13 Z" fill="#fff" stroke="#1c1917" stroke-width="1.4"/></marker>
<marker id="dia" markerWidth="16" markerHeight="12" refX="1" refY="6" orient="auto-start-reverse"><path d="M1,6 L8,1 L15,6 L8,11 Z" fill="#1c1917"/></marker>
<marker id="wine" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7a1f3d"/></marker>
</defs><rect width="100%" height="100%" fill="#fff"/><text x="30" y="34" font-size="17" font-weight="700" text-anchor="start" fill="#7a1f3d">Vista de arquitectura — componentes y flujo de datos</text><rect x="30" y="90" width="230" height="130" rx="10" fill="#fdf2f5" stroke="#7a1f3d" stroke-width="1.8"/><text x="145.0" y="114" font-size="14" font-weight="700" text-anchor="middle" fill="#7a1f3d">Navegador</text><text x="145.0" y="136" font-size="12" font-weight="400" text-anchor="middle" fill="#1c1917">React 19 + TanStack Start</text><text x="145.0" y="154" font-size="12" font-weight="400" text-anchor="middle" fill="#1c1917">shadcn/ui · Tailwind</text><text x="145.0" y="172" font-size="12" font-weight="400" text-anchor="middle" fill="#1c1917">React Query · :8080</text><rect x="320" y="120" width="170" height="70" rx="10" fill="#fff" stroke="#a8a29e" stroke-width="1.8"/><text x="405.0" y="144" font-size="14" font-weight="700" text-anchor="middle" fill="#a8a29e">Proxy de Vite</text><text x="405.0" y="166" font-size="12" font-weight="400" text-anchor="middle" fill="#1c1917">/api/* → :3000</text><rect x="550" y="70" width="340" height="190" rx="10" fill="#fdf2f5" stroke="#7a1f3d" stroke-width="1.8"/><text x="720.0" y="94" font-size="14" font-weight="700" text-anchor="middle" fill="#7a1f3d">API REST — Next.js 16 (:3000)</text><text x="720.0" y="116" font-size="12" font-weight="400" text-anchor="middle" fill="#1c1917">Rutas /api/restaurantes/{id}/*</text><text x="720.0" y="134" font-size="12" font-weight="400" text-anchor="middle" fill="#1c1917">requireSession (JWT en cookie httpOnly)</text><text x="720.0" y="152" font-size="12" font-weight="400" text-anchor="middle" fill="#1c1917">Validación Zod · handleRouteError</text><text x="720.0" y="170" font-size="12" font-weight="400" text-anchor="middle" fill="#1c1917">estadisticas · recomendaciones R1–R10</text><text x="720.0" y="188" font-size="12" font-weight="400" text-anchor="middle" fill="#1c1917">costo · catalogo (CC-01) · reporte</text><rect x="950" y="80" width="260" height="80" rx="10" fill="#e8f4ec" stroke="#2f7d4f" stroke-width="1.8"/><text x="1080.0" y="104" font-size="14" font-weight="700" text-anchor="middle" fill="#2f7d4f">Prisma 7 + SQLite</text><text x="1080.0" y="126" font-size="12" font-weight="400" text-anchor="middle" fill="#1c1917">dev.db · migraciones versionadas</text><rect x="950" y="190" width="260" height="70" rx="10" fill="#fff7e6" stroke="#b7791f" stroke-width="1.8"/><text x="1080.0" y="214" font-size="14" font-weight="700" text-anchor="middle" fill="#b7791f">Predictor (Python)</text><text x="1080.0" y="236" font-size="12" font-weight="400" text-anchor="middle" fill="#1c1917">RandomForest · .joblib por restaurante</text><rect x="550" y="330" width="340" height="110" rx="10" fill="#fff" stroke="#7a1f3d" stroke-width="1.8"/><text x="720.0" y="354" font-size="14" font-weight="700" text-anchor="middle" fill="#7a1f3d">Asistente conversacional</text><text x="720.0" y="376" font-size="12" font-weight="400" text-anchor="middle" fill="#1c1917">Gemini → Groq → modo guiado determinista</text><text x="720.0" y="394" font-size="12" font-weight="400" text-anchor="middle" fill="#1c1917">Flujos validados con el mismo esquema Zod</text><text x="720.0" y="412" font-size="12" font-weight="400" text-anchor="middle" fill="#1c1917">Registro por voz (Whisper)</text><line x1="260" y1="155" x2="318" y2="155" stroke="#1c1917" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="490" y1="155" x2="548" y2="155" stroke="#1c1917" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="890" y1="120" x2="948" y2="120" stroke="#1c1917" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="890" y1="225" x2="948" y2="225" stroke="#1c1917" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow)"/><text x="918" y="214" font-size="11" font-weight="400" text-anchor="middle" fill="#6b5f5f" font-style="italic">spawn</text><line x1="720" y1="262" x2="720" y2="328" stroke="#1c1917" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow)"/><text x="728" y="300" font-size="11" font-weight="400" text-anchor="start" fill="#6b5f5f" font-style="italic">usa</text><text x="30" y="300" font-size="13" font-weight="700" text-anchor="start" fill="#7a1f3d">Capas:</text><text x="30" y="324" font-size="12.5" font-weight="400" text-anchor="start" fill="#1c1917">• Presentación — frontend/src/routes, components</text><text x="30" y="346" font-size="12.5" font-weight="400" text-anchor="start" fill="#1c1917">• Lógica de negocio — src/lib</text><text x="30" y="368" font-size="12.5" font-weight="400" text-anchor="start" fill="#1c1917">• Persistencia — prisma/schema.prisma</text><text x="30" y="390" font-size="12.5" font-weight="400" text-anchor="start" fill="#1c1917">• Predicción — predictor/ (no se modifica)</text><text x="30" y="500" font-size="12" font-weight="400" text-anchor="start" fill="#6b5f5f">Todo el tráfico del navegador pasa por :8080 (mismo origen), por eso la cookie de sesión no requiere CORS.</text></svg>